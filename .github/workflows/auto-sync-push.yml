name: Auto Sync and Docker Push
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

env:
  UPSTREAM_REPO: https://github.com/maicent/dockhand.git
  UPSTREAM_BRANCH: feature/i18n
  TARGET_BRANCH: main
  # 替换为你的 Docker Hub 仓库名，格式为：用户名/项目名
  DOCKERHUB_REPO: ${{ secrets.DOCKER_USERNAME }}/dockhand

permissions:
  contents: write  # 允许读写仓库内容以同步代码
  actions: write  # 允许操作 Actions

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git and sync upstream
        id: sync_check # 添加 ID 以便后续步骤引用输出
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 配置Git身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加上游仓库
          git remote add upstream "$UPSTREAM_REPO" || true
          git fetch upstream "$UPSTREAM_BRANCH"
          
          # 创建临时分支并切换到目标分支
          git checkout -B temp-sync-branch "$TARGET_BRANCH"
          
          # 合并上游代码，使用 theirs 策略自动解决冲突
          git merge --allow-unrelated-histories --no-commit --no-ff -X theirs upstream/"$UPSTREAM_BRANCH" || true
          
          # 强力驱逐 .github 目录的任何变更
          git reset HEAD .github/ 2>/dev/null || true
          git checkout HEAD -- .github/ 2>/dev/null || true
          git clean -fd .github/ 2>/dev/null || true

          # ------------------ 已跳过无变更退出逻辑 ------------------
          if git diff --cached --quiet; then
            echo "⚠️ 上游无新源码变更，但已开启强制构建，继续执行..."
          else
            git commit -m "Auto sync from upstream: $(git log --format=%h -n 1 upstream/$UPSTREAM_BRANCH)" || true
          fi
          
          git push origin temp-sync-branch:"$TARGET_BRANCH" || true
          git checkout "$TARGET_BRANCH"
          git merge temp-sync-branch || true
          git branch -D temp-sync-branch 2>/dev/null || true
          
          # 强制标记需要构建镜像
          echo "should_build=true" >> $GITHUB_OUTPUT

# ==================== 动态注入内存配置到 Dockerfile ====================
      - name: Inject NODE_OPTIONS to Dockerfile
        if: steps.sync_check.outputs.should_build == 'true'
        run: |
          if [ -f Dockerfile ]; then
            echo "🔧 正在向 Dockerfile 注入 NODE_OPTIONS 内存配置..."
            
            # 在 app-builder 阶段 (FROM ... AS app-builder) 之后精准插入 ARG 和 ENV
            sed -i '/AS app-builder/a ARG NODE_OPTIONS="--max-old-space-size=6144"\nENV NODE_OPTIONS=${NODE_OPTIONS}' Dockerfile
            
            echo "=== 修改后的 app-builder 区域预览 ==="
            grep -A 5 "AS app-builder" Dockerfile
          else
            echo "⚠️ 未找到 Dockerfile"
          fi

      # ==================== Docker Hub 构建与推送步骤 ====================
      - name: Set up QEMU
        if: steps.sync_check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.sync_check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Generate package-lock.json
        if: steps.sync_check.outputs.should_build == 'true'
        run: npm install --package-lock-only --ignore-scripts

      - name: Login to Docker Hub
        if: steps.sync_check.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Swap Space
        if: steps.sync_check.outputs.should_build == 'true'
        uses: actionhippie/swap-space@v1
        with:
          size: 8G
    
      - name: Build and push Docker image
        if: steps.sync_check.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.DOCKERHUB_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_OPTIONS=--max-old-space-size=6144
